<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overwatch · CS2 Demo Review</title>
<style>
  :root{
    --bg:#0c0f14; --panel:#12161d; --panel-2:#171c25; --line:#232b38;
    --ink:#e8edf4; --ink-dim:#8b98ab; --ink-faint:#5a6678;
    --t:#e0a34a;       /* T side  */
    --ct:#5aa9e6;      /* CT side */
    --t-dead:#6b5330; --ct-dead:#33566e;
    --accent:#4ade9b;  /* signature green - actions/alive pulse */
    --danger:#ff5d5d;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr auto;height:100vh;overflow:hidden}

  header{
    grid-column:1/-1;display:flex;align-items:center;gap:20px;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
  .brand b{color:var(--accent)}
  .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:flex;gap:18px}
  .meta span b{color:var(--ink)}
  .loadbtn{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-dim);
    border:1px solid var(--line);background:var(--panel-2);padding:7px 12px;border-radius:6px;cursor:pointer}
  .loadbtn:hover{border-color:var(--accent);color:var(--ink)}

  /* stage */
  main{position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;min-width:0;overflow:hidden}
  /* The canvases keep a 900x900 drawing buffer (so all the world->pixel maths
     stays in 900-space) but are scaled down by CSS to fit the viewport. Without
     this the fixed 900px stage overlaps the transport bar on any screen shorter
     than ~1050px and the round buttons become unclickable. */
  #stage{position:relative;background:#070a0e;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;aspect-ratio:1/1;height:100%;max-height:100%;max-width:100%}
  #radar{display:block;width:100%;height:100%;image-rendering:auto}
  #overlay{position:absolute;inset:0;width:100%;height:100%}

  /* right rail */
  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
  .rail-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);margin:2px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .roster{display:flex;flex-direction:column;gap:3px;margin-bottom:22px}
  .prow{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;
    padding:7px 8px;border-radius:6px;font-size:13px;background:var(--panel-2)}
  .prow .dot{width:8px;height:8px;border-radius:50%}
  .prow .nmwrap{min-width:0}
  .prow .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* current callout, under the name - the whole point of the roster now */
  .prow .pl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow.dead .pl{visibility:hidden}
  .prow .kd{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .loadbtn.off{opacity:.5}
  .prow.dead{opacity:.4}
  .prow.dead .nm{text-decoration:line-through}
  .prow.pov{outline:1px solid var(--accent)}

  /* coach rail */
  #coach{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 11px}
  .card.live{border-color:var(--danger)}
  .card .hd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}
  .card .hd b{color:var(--danger)}
  .card .ln{font-size:12.5px;line-height:1.45;margin:0 0 5px}
  .card .ln:last-child{margin-bottom:0}
  .card .where{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .card .where i{color:var(--ink-faint);font-style:normal}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:3px;padding:2px 5px;color:var(--ink-dim)}
  .tag.bad{border-color:var(--danger);color:var(--danger)}
  .tag.warn{border-color:var(--t);color:var(--t)}
  .tip{border-left:2px solid var(--accent);padding-left:8px;margin-top:8px;font-size:12.5px;line-height:1.45}
  .tip .vd{color:var(--ink-dim);margin-bottom:4px}
  /* ask-the-coach */
  #ask{display:none;gap:6px;margin-bottom:16px}
  #ask.on{display:flex}
  #ask input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:8px 10px}
  #ask input:focus{outline:none;border-color:var(--accent)}
  #ask button{font-family:var(--mono);font-size:11px;background:var(--accent);color:#06120c;
    border:none;border-radius:6px;padding:0 12px;cursor:pointer;font-weight:700}
  #ask button:disabled{opacity:.45;cursor:default}
  .answer{border-left:2px solid var(--accent);padding-left:9px;margin-bottom:16px;
    font-size:12.5px;line-height:1.5}
  .answer .q{color:var(--ink-faint);font-family:var(--mono);font-size:11px;margin-bottom:5px}
  .muted{color:var(--ink-faint);font-size:12px;line-height:1.5}
  .muted code{color:var(--accent);background:var(--panel-2);padding:1px 5px;border-radius:3px;
    font-family:var(--mono);font-size:11px}
  .rbtn.flag{position:relative}
  .rbtn.flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;
    border-radius:50%;background:var(--danger)}
  .rbtn.active.flag::after{background:#06120c}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
  .stat .v{font-family:var(--mono);font-size:19px;font-weight:600}
  .stat .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
  .stat .v.good{color:var(--accent)} .stat .v.bad{color:var(--danger)}

  /* transport */
  .transport{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 20px;display:flex;flex-direction:column;gap:10px}
  .tl-row{display:flex;align-items:center;gap:14px}
  .btn{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;min-width:44px}
  .btn:hover{border-color:var(--accent)}
  .btn.play{background:var(--accent);color:#06120c;border-color:var(--accent);font-weight:700}
  .rounds{display:flex;gap:4px;flex-wrap:wrap}
  .rbtn{font-family:var(--mono);font-size:11px;width:26px;height:26px;border-radius:5px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
  .rbtn.active{background:var(--accent);color:#06120c;border-color:var(--accent);font-weight:700}
  .rbtn.t-win{border-bottom:2px solid var(--t)} .rbtn.ct-win{border-bottom:2px solid var(--ct)}
  .scrub{flex:1;display:flex;align-items:center;gap:12px}
  input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .clock{font-family:var(--mono);font-size:14px;min-width:88px;color:var(--ink-dim)}
  .clock b{color:var(--ink)}
  .speed{font-family:var(--mono);font-size:12px;color:var(--ink-dim);cursor:pointer;
    border:1px solid var(--line);border-radius:5px;padding:6px 9px;background:var(--panel-2)}

  /* killfeed - HTML overlay rather than canvas text, so it stays crisp while
     the canvas is CSS-scaled down on smaller screens */
  #killfeed{position:absolute;top:10px;right:10px;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    font-family:var(--mono);font-size:11px;line-height:1}
  .kf{display:flex;align-items:center;gap:7px;white-space:nowrap;
    background:rgba(8,11,15,.82);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
  .kf .w{color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em}
  .kf .wicon{display:block;height:12px;width:auto;max-width:46px;opacity:.92}
  .kf .wicon.hs{height:13px}
  .kf .hs{color:var(--danger);font-weight:700}
  .kf .as{color:var(--ink-faint)}
  .kf .side-t{color:var(--t)} .kf .side-ct{color:var(--ct)} .kf .side-none{color:var(--ink-faint)}
  .kf.pov{border-color:var(--accent)}

  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:var(--ink-dim);font-family:var(--mono);font-size:13px;text-align:center}
  .empty code{color:var(--accent);background:var(--panel-2);padding:2px 7px;border-radius:4px}
  input[type=file]{display:none}
  .legend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);align-items:center}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
  <header>
    <div class="brand">OVER<b>WATCH</b></div>
    <div class="meta" id="meta">
      <span>MAP <b id="m-map">—</b></span>
      <span>ROUNDS <b id="m-rounds">—</b></span>
      <span>POV <b id="m-pov">—</b></span>
      <span>AT <b id="m-place">—</b></span>
    </div>
    <button class="loadbtn" id="toggle-callouts" style="margin-left:auto" title="Toggle map callout labels (C)">CALLOUTS ON</button>
    <button class="loadbtn" id="toggle-utility" style="margin-left:8px" title="Toggle smokes, molotovs, flashes, HEs and throw arcs (U)">UTILITY ON</button>
    <label class="loadbtn" style="margin-left:8px">LOAD MATCH JSON<input type="file" id="file" accept=".json"></label>
  </header>

  <main>
    <div id="stage">
      <canvas id="radar" width="900" height="900"></canvas>
      <canvas id="overlay" width="900" height="900"></canvas>
      <div id="killfeed"></div>
      <div class="empty" id="empty">
        <div>NO MATCH LOADED</div>
        <div>run <code>python parser/parse_demo.py your.dem</code>, then load the JSON from <code>data/</code></div>
      </div>
    </div>
  </main>

  <aside>
    <div class="rail-h">Coach</div>
    <form id="ask" autocomplete="off">
      <input id="ask-q" maxlength="500" placeholder="Ask about this moment…">
      <button type="submit" id="ask-go">ASK</button>
    </form>
    <div id="answer"></div>
    <div id="coach"></div>
    <div class="rail-h">Roster</div>
    <div class="roster" id="roster"></div>
    <div class="rail-h">Selected player</div>
    <div class="statgrid" id="statgrid"></div>
    <div class="legend" style="margin-top:18px">
      <span><i style="background:var(--t)"></i>T</span>
      <span><i style="background:var(--ct)"></i>CT</span>
      <span><i style="background:var(--danger)"></i>kill</span>
    </div>
  </aside>

  <div class="transport">
    <div class="tl-row">
      <div class="rounds" id="rounds"></div>
    </div>
    <div class="tl-row">
      <button class="btn play" id="play">▶</button>
      <div class="scrub">
        <input type="range" id="seek" min="0" max="0" value="0" step="1">
        <div class="clock"><b id="c-cur">0</b> / <span id="c-max">0</span></div>
      </div>
      <div class="speed" id="speed">1×</div>
    </div>
  </div>

<script>
const CAL_URL = "map_calibration.json";
let CAL = {};
let M = null;              // match data
let frames = [];          // frames for current round
let allFrames = [];       // all frames
// pos is a FRACTIONAL frame index. Positions are sampled every `sample_every`
// ticks (~0.5s), so drawing frames[Math.round(pos)] makes players teleport twice
// a second. We keep the fraction and interpolate, which is what the parser's
// docstring always claimed playback did.
let pos = 0, playing=false, speed=1, selected=null;
let dirty = true;          // redraw once while paused after a seek/selection
let lastTick = -Infinity;  // highest game tick already drawn, for kill markers
let radarImg = new Image();
let radarReady=false, worldToPx=null;
let killMarks=[];         // {x,y,born} on overlay - ages in milliseconds, not frames
let PLACES = {};          // callout name -> {x,y,n} label anchor, from the parser
let PLACE_NAMES = [];     // index -> callout name, for the per-entry `pl` field
let showCallouts = true;
let showUtility = true;
let UTIL = {smokes:[],fires:[],flashes:[],hes:[],throws:[]};
let BOMB = [];
// Two separate layers, and the split matters:
//   ANALYSIS is arithmetic from analyze.py - always true, always available.
//   COACH is the model's reading of it - optional, and absent without an API key.
// The panel is built so the deterministic half stands on its own.
let ANALYSIS = null;
let COACH = null;
let coachKey = null;      // last rendered state, so we only touch the DOM on change

const KILL_MARK_MS = 1500;   // how long a kill ring stays on screen
// Max distance a player can legitimately cover between two samples. CS2 run
// speed tops out around 250 u/s, so ~125u per 0.5s sample. Anything past this
// is a teleport (respawn, round reset) and must snap rather than glide across
// the map.
const MAX_LERP_DIST = 400;

const lerp = (a,b,t)=>a+(b-a)*t;
// shortest way round the circle, so 350deg -> 10deg turns +20 and not -340
const lerpAngle = (a,b,t)=>a+((((b-a)%360)+540)%360-180)*t;

// real milliseconds one sampled frame represents
function frameMs(){ return 1000*((M&&M.sample_every)||32)/((M&&M.tickrate)||64); }
function clockStr(sec){
  sec=Math.max(0,sec);
  return Math.floor(sec/60)+":"+String(Math.floor(sec%60)).padStart(2,"0");
}

const $ = s=>document.querySelector(s);
const radar=$("#radar"), octx=$("#overlay").getContext("2d"), rctx=radar.getContext("2d");

// ---- calibration / coordinate transform ----
function makeTransform(map){
  const c = CAL[map];
  if(!c){ console.warn("no calibration for",map); return null; }
  const scale = c.scale * 1024;   // radar images are 1024px source
  return (x,y)=>({
    x: ((x - c.pos_x)/scale) * radar.width,
    y: ((c.pos_y - y)/scale) * radar.height
  });
}

// ---- load a match object ----
async function loadMatch(data){
  M = data;
  allFrames = data.frames||[];
  $("#empty").style.display="none";
  $("#m-map").textContent = data.map||"—";
  $("#m-rounds").textContent = (data.stats&&data.stats.rounds_played)||data.rounds?.length||"—";
  $("#m-pov").textContent = data.pov||"—";

  // radar image
  radarReady=false;
  radarImg = new Image();
  radarImg.onload=()=>{radarReady=true; draw();};
  radarImg.onerror=()=>{radarReady=false; draw();};
  radarImg.src = `../radars/${data.map}.png`;
  worldToPx = makeTransform(data.map);

  // callout labels: name -> {x,y,n}. Absent on JSON from an older parser, so
  // everything downstream has to treat an empty table as "no callouts", not
  // as an error.
  PLACES = data.places || {};
  PLACE_NAMES = data.place_names || [];
  UTIL = Object.assign({smokes:[],fires:[],flashes:[],hes:[],throws:[]},
                       data.utility||{});
  BOMB = data.bomb || [];

  // Sidecars, both optional. Cleared first so switching matches can't leave
  // the previous match's coaching on screen.
  ANALYSIS = null; COACH = null; coachKey = null;
  MATCH_NAME = data._name || null;
  if(data._name) loadSidecars(data._name);

  buildRounds();
  selectRound(firstRound());
  buildRoster();
  // data.rounds is optional-chained one line above; data.players was not, so a
  // JSON without a player list threw here instead of loading with an empty roster.
  selectPlayer(data.pov || (data.players?.[0]&&data.players[0].name));
}

// data/<name>_analysis.json and data/<name>_coach.json. Both are optional and a
// missing one is the normal case, not an error - the analysis needs a separate
// command, and the coaching needs an API key on top of that.
function loadSidecars(name){
  fetch(`../data/${name}_analysis.json`).then(r=>r.ok?r.json():null).catch(()=>null)
    .then(a=>{ if(a){ ANALYSIS=a; coachKey=null; buildRounds(); dirty=true; draw(); }});
  fetch(`../data/${name}_coach.json`).then(r=>r.ok?r.json():null).catch(()=>null)
    .then(c=>{ if(c){ COACH=c; coachKey=null; buildRounds(); dirty=true; draw(); }});
}

function firstRound(){
  const rs=[...new Set(allFrames.map(f=>frameRound(f)))].filter(r=>r!=null).sort((a,b)=>a-b);
  return rs.length?rs[0]:null;
}
function frameRound(f){
  // frames don't carry round; infer by kills' tick ranges if needed.
  // Simpler: we filter by kill rounds using tick windows built in buildRounds().
  return f._r;
}

// assign each frame to a round
function buildRounds(){
  const roundsEl=$("#rounds"); roundsEl.innerHTML="";

  // Prefer the authoritative tick windows the parser already put in the JSON.
  // Inferring them from kill ticks (the old behaviour) misplaces every frame
  // before the first kill and after the last one - measured at 374 of 4063
  // frames on 2v5.dem, up to 21s of gameplay landing in the wrong round.
  let bounds = (M.rounds||[])
    .filter(r=>r && r.round_num!=null && r.start!=null)
    .map(r=>({r:r.round_num, minT:r.start, maxT:(r.official_end ?? r.end ?? Infinity)}))
    .sort((a,b)=>a.minT-b.minT);

  if(!bounds.length){
    // fallback: no round table, infer windows from kills
    const byRound={};
    (M.kills||[]).forEach(k=>{ if(k.round!=null){ (byRound[k.round]=byRound[k.round]||[]).push(k.tick);}});
    bounds = Object.keys(byRound).map(Number).sort((a,b)=>a-b)
      .map(r=>({r, minT:Math.min(...byRound[r]), maxT:Math.max(...byRound[r])}));
  }

  const rlist = bounds.map(b=>b.r);

  if(bounds.length){
    allFrames.forEach(f=>{
      // inside a round window wins outright; otherwise (warmup, timeouts) fall
      // back to the nearest window so no frame is orphaned
      let best=bounds[0].r, bd=Infinity;
      for(const b of bounds){
        const d = f.tick<b.minT ? b.minT-f.tick : f.tick>b.maxT ? f.tick-b.maxT : 0;
        if(d<bd){bd=d;best=b.r; if(d===0) break;}
      }
      f._r=best;
    });
  } else {
    allFrames.forEach(f=>f._r=1);
    rlist.push(1);
  }

  const winners={}; (M.rounds||[]).forEach((r,i)=>{ winners[(r.round_num??i+1)] = (r.winner||"").toString().toUpperCase();});
  // rounds the reviewed player died in - a dot on the timeline so you can jump
  // straight to the moments worth reviewing instead of scrubbing for them
  const flagged=new Set((ANALYSIS?.deaths||[]).map(d=>d.round));
  rlist.forEach(r=>{
    const b=document.createElement("button");
    b.className="rbtn"+(winners[r]==="T"?" t-win":winners[r]==="CT"?" ct-win":"")
      +(flagged.has(r)?" flag":"");
    b.textContent=r; b.dataset.r=r;
    if(flagged.has(r)) b.title=`${ANALYSIS.player} died this round`;
    b.onclick=()=>selectRound(r);
    roundsEl.appendChild(b);
  });
}

function selectRound(r){
  if(r==null) return;
  frames = allFrames.filter(f=>f._r===r);
  if(!frames.length) frames=allFrames;
  pos=0;
  $("#seek").max = Math.max(0,frames.length-1);
  $("#seek").step = "any";          // let the thumb track continuous playback
  $("#seek").value = 0;
  $("#c-max").textContent = clockStr((frames.length-1)*frameMs()/1000);
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.toggle("active",+b.dataset.r===r));
  resetKillCursor();
  draw();
}

// ---- roster + stats ----
function buildRoster(){
  const el=$("#roster"); el.innerHTML="";
  (M.players||[]).forEach(p=>{
    const st=(M.stats&&M.stats.per_player&&M.stats.per_player[p.name])||{};
    const row=document.createElement("div");
    row.className="prow"+(p.name===M.pov?" pov":"");
    row.dataset.name=p.name;
    row.innerHTML=`<span class="dot" data-dot></span>
      <span class="nmwrap"><span class="nm">${esc(p.name)}</span><span class="pl" data-pl></span></span>
      <span class="kd">${st.kills??0}–${st.deaths??0}</span>`;
    row.onclick=()=>selectPlayer(p.name);
    el.appendChild(row);
  });
}
function selectPlayer(name){
  selected=name; dirty=true;
  document.querySelectorAll(".prow").forEach(r=>r.style.background=r.dataset.name===name?"var(--line)":"var(--panel-2)");
  const st=(M.stats&&M.stats.per_player&&M.stats.per_player[name])||{};
  const cells=[
    ["v",`${st.kills??0}/${st.deaths??0}/${st.assists??0}`,"K / D / A"],
    ["v",(st.kd??0),"K/D"],
    ["v",(st.hs_pct??0)+"%","HS %", st.hs_pct>=50?"good":""],
    ["v",(st.entry_win_pct??0)+"%","Entry win", st.entry_win_pct>=50?"good":st.entry_attempts?"bad":""],
    ["v",(st.opening_deaths??0),"Opening deaths", st.opening_deaths>=4?"bad":""],
    ["v",(st.flash_assists??0),"Flash assists"],
  ];
  $("#statgrid").innerHTML=cells.map(c=>
    `<div class="stat"><div class="v ${c[3]||''}">${c[1]}</div><div class="l">${c[2]}</div></div>`).join("");
}

// ---- callout labels ----
// Drawn on the RADAR canvas, not the overlay: they're static for the whole
// match, so they belong with the map image rather than being re-stroked
// alongside ten players every animation frame.
//
// Valve's internal names are jammed-together CamelCase ("BombsiteA",
// "LowerTunnel"). Split them so the map reads like a callout and not like a
// symbol dump.
// Resolve a frame entry's interned callout index back to its name. Older JSON
// has no `pl` at all, so this quietly returns null rather than "undefined".
function placeOf(pl){
  if(!pl || pl.pl==null) return null;
  return PLACE_NAMES[pl.pl] || null;
}
function calloutLabel(name){
  return String(name)
    .replace(/([a-z])([A-Z])/g,"$1 $2")
    .replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2")
    .toUpperCase();
}
function drawCallouts(){
  if(!showCallouts || !worldToPx) return;
  const names = Object.keys(PLACES);
  if(!names.length) return;
  rctx.save();
  rctx.font = "600 11px "+(getCSS('--mono')||"monospace");
  rctx.textAlign = "center";
  rctx.textBaseline = "middle";
  for(const name of names){
    const c = PLACES[name];
    if(!c || c.x==null || c.y==null) continue;
    const p = worldToPx(c.x, c.y);
    if(p.x<0||p.y<0||p.x>radar.width||p.y>radar.height) continue;
    const text = calloutLabel(name);
    // Radar art runs from near-black to near-white, so neither a light nor a
    // dark label is readable everywhere. Stroke a dark halo behind the glyphs
    // and the text survives both.
    rctx.lineWidth = 3;
    rctx.strokeStyle = "rgba(6,9,13,.85)";
    rctx.strokeText(text, p.x, p.y);
    rctx.fillStyle = "rgba(190,205,225,.62)";
    rctx.fillText(text, p.x, p.y);
  }
  rctx.restore();
}

// ---- utility ----
// Radii are world units. CS2 smokes cover roughly 144u; a molotov pool is a
// bit tighter. These are rendering choices, not demo facts, so they live here
// rather than in the parser output.
const SMOKE_RADIUS = 144;
const FIRE_RADIUS  = 120;
const POP_SECONDS  = 1.5;   // how long a flash/HE burst stays on screen
const THROW_TRAIL  = 2.0;   // seconds a throw arc lingers after it lands

// Like the killfeed, everything here is a PURE FUNCTION of curTick - an item is
// drawn if the tick falls inside its own window. Nothing is queued and nothing
// is remembered, so scrubbing backwards and jumping rounds stay correct.
function drawUtility(curTick){
  if(!showUtility || !worldToPx || curTick==null) return;
  const rate=(M&&M.tickrate)||64;

  // throw arcs first, so live smoke sits on top of its own trajectory
  for(const t of UTIL.throws||[]){
    if(curTick < t.s || curTick > t.e + THROW_TRAIL*rate) continue;
    const pts=t.p; if(!pts||pts.length<2) continue;
    // draw only as far as the grenade has actually flown
    const frac=Math.max(0,Math.min(1,(curTick-t.s)/Math.max(1,t.e-t.s)));
    const upto=Math.max(2,Math.ceil(frac*pts.length));
    const fade=curTick>t.e ? 1-(curTick-t.e)/(THROW_TRAIL*rate) : 1;
    octx.save();
    octx.globalAlpha=Math.max(0,fade)*0.75;
    octx.strokeStyle=utilColour(t.kind,t.side);
    octx.lineWidth=1.5; octx.setLineDash([4,3]);
    octx.beginPath();
    for(let i=0;i<upto;i++){
      const p=worldToPx(pts[i][0],pts[i][1]);
      i?octx.lineTo(p.x,p.y):octx.moveTo(p.x,p.y);
    }
    octx.stroke();
    octx.restore();
  }

  // active smokes
  for(const s of UTIL.smokes||[]){
    if(curTick<s.s || curTick>s.e) continue;
    const p=worldToPx(s.x,s.y);
    const rpx=SMOKE_RADIUS*pxPerUnit();
    // fade the last second so it doesn't vanish mid-frame
    const left=(s.e-curTick)/rate;
    octx.save();
    octx.globalAlpha=left<1?Math.max(0.1,left):1;
    octx.fillStyle="rgba(214,222,234,.34)";
    octx.strokeStyle="rgba(232,237,244,.55)";
    octx.lineWidth=1.5;
    octx.beginPath(); octx.arc(p.x,p.y,rpx,0,7); octx.fill(); octx.stroke();
    octx.restore();
  }

  // active fires
  for(const f of UTIL.fires||[]){
    if(curTick<f.s || curTick>f.e) continue;
    const p=worldToPx(f.x,f.y);
    const rpx=FIRE_RADIUS*pxPerUnit();
    const g=octx.createRadialGradient(p.x,p.y,rpx*0.2,p.x,p.y,rpx);
    g.addColorStop(0,"rgba(255,148,46,.55)");
    g.addColorStop(1,"rgba(255,86,20,.12)");
    octx.save();
    octx.fillStyle=g;
    octx.beginPath(); octx.arc(p.x,p.y,rpx,0,7); octx.fill();
    octx.strokeStyle="rgba(255,132,40,.7)"; octx.lineWidth=1.5; octx.stroke();
    octx.restore();
  }

  // flash + HE pops: brief, expanding, then gone
  const pops=[["flashes","rgba(255,255,255,",30],["hes","rgba(255,120,90,",26]];
  for(const [key,rgb,maxR] of pops){
    for(const e of UTIL[key]||[]){
      const age=(curTick-e.t)/(POP_SECONDS*rate);
      if(age<0||age>1) continue;
      const p=worldToPx(e.x,e.y);
      octx.save();
      octx.strokeStyle=rgb+(1-age)+")"; octx.lineWidth=2;
      octx.beginPath(); octx.arc(p.x,p.y,6+age*maxR,0,7); octx.stroke();
      if(key==="flashes"){
        octx.fillStyle="rgba(255,255,255,"+(0.35*(1-age))+")";
        octx.beginPath(); octx.arc(p.x,p.y,6+age*maxR,0,7); octx.fill();
      }
      octx.restore();
    }
  }

  // planted bomb stays put until it goes off or is defused
  for(const b of BOMB||[]){
    if(b.event!=="plant") continue;
    const done=(BOMB.find(x=>x.r===b.r&&(x.event==="defuse"||x.event==="detonate"))||{}).t;
    if(curTick<b.t || (done!=null && curTick>done)) continue;
    const p=worldToPx(b.x,b.y);
    const blink=0.55+0.45*Math.sin(curTick/rate*6);
    octx.save();
    octx.fillStyle="rgba(255,93,93,"+blink.toFixed(2)+")";
    octx.beginPath();
    octx.moveTo(p.x,p.y-7); octx.lineTo(p.x+7,p.y); octx.lineTo(p.x,p.y+7);
    octx.lineTo(p.x-7,p.y); octx.closePath(); octx.fill();
    octx.restore();
  }
}

// world units -> canvas pixels, from the same calibration the transform uses
function pxPerUnit(){
  const c=CAL[M&&M.map]; if(!c) return 0.2;
  return radar.width/(c.scale*1024);
}
function utilColour(kind,side){
  if(kind==="smoke") return "rgba(214,222,234,.9)";
  if(kind==="fire")  return "rgba(255,132,40,.9)";
  if(kind==="flash") return "rgba(255,255,255,.9)";
  if(kind==="he")    return "rgba(255,120,90,.9)";
  return side==="t"?getCSS('--t'):getCSS('--ct');
}

// ---- draw ----
function draw(){
  rctx.clearRect(0,0,radar.width,radar.height);
  if(radarReady){ rctx.drawImage(radarImg,0,0,radar.width,radar.height); }
  else { rctx.fillStyle="#0b0e13"; rctx.fillRect(0,0,radar.width,radar.height);
    rctx.fillStyle="#2a3444"; rctx.font="13px monospace"; rctx.textAlign="center";
    rctx.fillText("radar image missing for "+(M?.map||""), radar.width/2, radar.height/2);}
  drawCallouts();
  octx.clearRect(0,0,radar.width,radar.height);
  if(!frames.length||!worldToPx){ drawKillfeed(null); return; }

  const now = performance.now();
  const i   = Math.max(0, Math.min(Math.floor(pos), frames.length-1));
  const frac= Math.max(0, Math.min(1, pos - i));
  const fr  = frames[i];
  const nx  = frames[i+1] || null;

  // index the next frame by player so we can pair samples up
  const next = {};
  if(nx) (nx.players||[]).forEach(p=>{ next[p.n]=p; });

  // Utility is drawn BEFORE players so smoke never hides a player dot - you
  // want to see who's standing in it. Needs curTick, which the kill-marker
  // block below also computes, so hoist it here.
  const utilTick = (nx && fr.tick!=null && nx.tick!=null)
    ? lerp(fr.tick,nx.tick,frac) : fr.tick;
  drawUtility(utilTick);

  // kill flashes - aged in real milliseconds so they last the same wall-clock
  // time whether we're drawing at 2fps or 144fps
  killMarks = killMarks.filter(k => now - k.born < KILL_MARK_MS);
  killMarks.forEach(k=>{
    const p=worldToPx(k.x,k.y);
    const age=(now-k.born)/KILL_MARK_MS;
    octx.strokeStyle=`rgba(255,93,93,${1-age})`; octx.lineWidth=2;
    octx.beginPath(); octx.arc(p.x,p.y,6+age*22,0,7); octx.stroke();
  });

  (fr.players||[]).forEach(pl=>{
    const np = next[pl.n];
    let x=pl.x, y=pl.y, yaw=pl.yaw;
    if(np && frac>0){
      // don't glide a player across the map on a teleport
      if(Math.hypot(np.x-pl.x, np.y-pl.y) <= MAX_LERP_DIST){
        x=lerp(pl.x,np.x,frac); y=lerp(pl.y,np.y,frac);
      }
      if(pl.yaw!=null && np.yaw!=null) yaw=lerpAngle(pl.yaw,np.yaw,frac);
    }
    const p=worldToPx(x,y);
    const isT=(pl.t||"").toString().toUpperCase().startsWith("T");
    const alive=pl.a!==false && (pl.hp==null||pl.hp>0);
    const col = alive ? (isT?getCSS('--t'):getCSS('--ct')) : (isT?getCSS('--t-dead'):getCSS('--ct-dead'));

    // view cone
    if(alive && yaw!=null){
      const a=-yaw*Math.PI/180;
      octx.fillStyle=isT?"rgba(224,163,74,.16)":"rgba(90,169,230,.16)";
      octx.beginPath(); octx.moveTo(p.x,p.y);
      octx.arc(p.x,p.y,26,a-0.5,a+0.5); octx.closePath(); octx.fill();
    }
    // body
    octx.beginPath(); octx.arc(p.x,p.y,alive?6:4,0,7);
    octx.fillStyle=col; octx.fill();
    if(pl.n===selected){octx.strokeStyle=getCSS('--accent');octx.lineWidth=2;octx.stroke();}
    // name for selected/pov, with the callout they're standing in under it
    if(pl.n===selected){
      octx.textAlign="center";
      octx.fillStyle=getCSS('--ink'); octx.font="11px monospace";
      octx.fillText(pl.n,p.x,p.y-11);
      const where = placeOf(pl);
      if(where && alive){
        octx.fillStyle=getCSS('--accent'); octx.font="9px monospace";
        octx.fillText(calloutLabel(where),p.x,p.y-22);
      }
    }
  });

  // roster alive/dead sync + current callout
  document.querySelectorAll(".prow").forEach(r=>{
    const pl=(fr.players||[]).find(x=>x.n===r.dataset.name);
    const alive=pl&&pl.a!==false&&(pl.hp==null||pl.hp>0);
    r.classList.toggle("dead",pl&&!alive);
    const dot=r.querySelector("[data-dot]");
    if(pl){const isT=(pl.t||"").toUpperCase().startsWith("T");
      dot.style.background=isT?getCSS('--t'):getCSS('--ct');}
    const plEl=r.querySelector("[data-pl]");
    if(plEl){
      const where = pl ? placeOf(pl) : null;
      plEl.textContent = where ? calloutLabel(where) : "";
    }
  });

  // header "AT <callout>" for whoever is selected
  const sel=(fr.players||[]).find(x=>x.n===selected);
  const selAlive=sel&&sel.a!==false&&(sel.hp==null||sel.hp>0);
  const selWhere=sel&&selAlive?placeOf(sel):null;
  $("#m-place").textContent = selWhere ? calloutLabel(selWhere) : "—";

  // clock - real round time now that pos is continuous
  $("#c-cur").textContent = clockStr(pos*frameMs()/1000);
  $("#seek").value = pos;

  // Fire kills by crossing their game tick, not by proximity to a sample. The
  // old window test could fire twice or miss entirely depending on frame rate.
  const curTick = utilTick;
  if(curTick!=null){
    (M.kills||[]).forEach(k=>{
      if(k.tick==null || k.vx==null) return;
      if(k.tick>lastTick && k.tick<=curTick) killMarks.push({x:k.vx,y:k.vy,born:now});
    });
    lastTick = curTick;
  }
  drawKillfeed(curTick);
  drawCoach(curTick);
}

// ---- coach panel ----
// Same contract as the killfeed and for the same reason: a PURE FUNCTION of the
// current tick. Nothing queued, nothing remembered. Scrubbing backwards,
// jumping rounds and changing speed then all stay correct with no bookkeeping,
// and a stale tip can't survive a round change.
const DEATH_CARD_LEAD = 8;    // seconds of game time before a death to arm the card
const DEATH_CARD_HOLD = 6;    // ...and after it

function tagsFor(d){
  const t=[];
  if(d.opening) t.push(["opening duel","warn"]);
  if(!d.traded) t.push(["untraded","bad"]);
  if(d.repeek) t.push([`re-peek +${d.repeek_after}s`,"bad"]);
  if(d.isolated) t.push(["isolated","bad"]);
  if(d.man_state==="down") t.push(["already down",""]);
  if(d.post_plant) t.push(["post-plant",""]);
  if(d.awp) t.push(["awp",""]);
  if(d.blind) t.push(["they were flashed",""]);
  if(d.smoke) t.push(["through smoke",""]);
  if(d.wallbang) t.push(["wallbang",""]);
  return t;
}

function deathCard(d, live){
  const tip = (COACH?.deaths||[]).find(x=>x.round===d.round && x.tick===d.tick);
  const mate = d.nearest_mate!=null
    ? `nearest teammate <b>${Math.round(d.nearest_mate)}u</b>`
    : `<b>last alive</b>`;
  return `<div class="card${live?" live":""}">
    <div class="hd"><span>R${d.round} · ${d.t}s${live?" · <b>DEATH</b>":""}</span>
      <span>${d.alive_own}v${d.alive_enemy}</span></div>
    <div class="where">${esc(calloutLabel(d.victim_place||"?"))}
      <i>&lt;-</i> ${esc(calloutLabel(d.attacker_place||"?"))}
      <i>·</i> ${esc(d.weapon||"?")}</div>
    <div class="ln" style="margin-top:6px;color:var(--ink-dim)">${mate}</div>
    <div class="tags">${tagsFor(d).map(([txt,cls])=>
      `<span class="tag ${cls}">${esc(txt)}</span>`).join("")}</div>
    ${tip?`<div class="tip"><div class="vd">${esc(tip.verdict)}</div>${esc(tip.tip)}</div>`:""}
  </div>`;
}

function patternCards(){
  const places=(ANALYSIS?.death_places||[]).filter(p=>p.notable);
  const aiPatterns=COACH?.patterns||[];
  if(!places.length && !aiPatterns.length) return "";
  let html=`<div class="rail-h" style="margin-top:4px">Repeat patterns</div>`;
  for(const p of places){
    const ai=aiPatterns.find(x=>(x.detail||"").includes(p.place)||(x.title||"").includes(p.place));
    const angles=p.from.map(f=>`${calloutLabel(f.place)} x${f.n}`).join(", ");
    html+=`<div class="card">
      <div class="hd"><span>${esc(calloutLabel(p.place))}</span>
        <span><b>${p.deaths}</b> deaths</span></div>
      <div class="ln" style="color:var(--ink-dim)">${p.untraded} untraded${
        p.repeeks?`, ${p.repeeks} re-peeking a lost duel`:""} · rounds ${p.rounds.join(", ")}</div>
      <div class="ln" style="color:var(--ink-faint);font-family:var(--mono);font-size:11px">
        killed from ${esc(angles)}</div>
      ${ai?`<div class="tip"><div class="vd">${esc(ai.detail)}</div>${esc(ai.tip)}</div>`:""}
    </div>`;
  }
  for(const p of aiPatterns.filter(x=>!places.some(pl=>
      (x.detail||"").includes(pl.place)||(x.title||"").includes(pl.place)))){
    html+=`<div class="card"><div class="hd"><span>${esc(p.title)}</span></div>
      <div class="ln" style="color:var(--ink-dim)">${esc(p.detail)}</div>
      <div class="tip">${esc(p.tip)}</div></div>`;
  }
  return html;
}

function drawCoach(curTick){
  const el=$("#coach");
  if(!ANALYSIS){
    const key="none";
    if(coachKey!==key){
      coachKey=key;
      el.innerHTML=`<div class="muted">No analysis for this match yet.<br><br>
        <code>python parser/analyze.py data/${esc(M?.map?(M.pov||"match"):"match")}.json --emit</code>
        <br><br>builds the death review. <code>parser/coach.py</code> then adds
        AI verdicts on top.</div>`;
    }
    return;
  }

  const deaths=ANALYSIS.deaths||[];
  const rate=(M&&M.tickrate)||64;
  // "near" is measured in GAME time so the window doesn't shrink at 4x speed
  const live=curTick==null?null:deaths.find(d=>
    curTick >= d.tick - DEATH_CARD_LEAD*rate && curTick <= d.tick + DEATH_CARD_HOLD*rate);
  // otherwise show whichever death belongs to the round being watched
  const rnd=currentRound();
  const inRound=deaths.filter(d=>d.round===rnd);
  const roundTip=(COACH?.rounds||[]).find(r=>r.round===rnd);

  const key=[live?live.tick:"-",rnd,inRound.map(d=>d.tick).join(","),
             COACH?"c":"-"].join("|");
  if(key===coachKey) return;
  coachKey=key;

  let html="";
  if(COACH?.summary) html+=`<div class="card"><div class="ln">${esc(COACH.summary)}</div></div>`;
  if(roundTip) html+=`<div class="card"><div class="hd"><span>Round ${rnd}</span></div>
    <div class="tip">${esc(roundTip.tip)}</div></div>`;

  if(live) html+=deathCard(live,true);
  else if(inRound.length) html+=inRound.map(d=>deathCard(d,false)).join("");
  else html+=`<div class="muted">${esc(ANALYSIS.player)} survived round ${rnd}.</div>`;

  html+=patternCards();
  el.innerHTML=html;
}

function currentRound(){
  if(!frames.length) return null;
  const i=Math.max(0,Math.min(Math.floor(pos),frames.length-1));
  const f=frames[i];
  return f.round!=null?f.round:f._r;
}
function currentTick(){
  if(!frames.length) return null;
  const i=Math.max(0,Math.min(Math.floor(pos),frames.length-1));
  const fr=frames[i], nx=frames[i+1];
  if(!nx||fr.tick==null||nx.tick==null) return fr.tick;
  return Math.round(lerp(fr.tick,nx.tick,pos-i));
}

// ---- ask the coach ----
// Only shown when server/app.py is running WITH a key. Served as a plain
// static file there's no endpoint to call, and offering a button that can only
// fail is worse than not offering one.
let MATCH_NAME=null;
async function initAsk(){
  const st=await fetch("/api/status").then(r=>r.ok?r.json():null).catch(()=>null);
  if(!st||!st.llm) return;
  $("#ask").classList.add("on");
  $("#ask-q").placeholder=`Ask about this moment (${st.model})…`;
}
$("#ask").onsubmit=async e=>{
  e.preventDefault();
  const q=$("#ask-q").value.trim();
  if(!q||!MATCH_NAME) return;
  const tick=currentTick();
  const btn=$("#ask-go"), out=$("#answer");
  btn.disabled=true; btn.textContent="…";
  // Pause: the answer is about ONE tick, and letting playback run means the
  // reply lands describing a moment that's already gone.
  playing=false; $("#play").textContent="▶";
  out.innerHTML=`<div class="answer"><div class="q">${esc(q)}</div>thinking…</div>`;
  try{
    const r=await fetch("/api/ask",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({match:MATCH_NAME,player:ANALYSIS?.player||M.pov,
                           tick,question:q})});
    const d=await r.json();
    out.innerHTML=`<div class="answer"><div class="q">R${d.round??"?"} ${
      d.t!=null?d.t+"s":""} · ${esc(q)}</div>${esc(d.answer||d.error||"no answer")}</div>`;
    if(r.ok) $("#ask-q").value="";
  }catch(err){
    out.innerHTML=`<div class="answer"><div class="q">${esc(q)}</div>${esc(String(err))}</div>`;
  }finally{ btn.disabled=false; btn.textContent="ASK"; }
};

// Re-arm the kill cursor at the current position without firing anything.
// Used after a seek or a round change so we don't replay every earlier kill.
function resetKillCursor(){
  killMarks=[];
  if(!frames.length){lastTick=-Infinity;return;}
  const i=Math.max(0,Math.min(Math.floor(pos),frames.length-1));
  lastTick = frames[i].tick!=null ? frames[i].tick : -Infinity;
}
// Cached because this used to run getComputedStyle() 2-4x PER PLAYER PER FRAME
// (colour lookups inside the draw loop). At 144Hz with ten players that is a
// forced style recalc several hundred times a second for values that only ever
// change when someone edits the stylesheet.
const _cssCache = {};
function getCSS(v){
  if(_cssCache[v]===undefined){
    _cssCache[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  }
  return _cssCache[v];
}

// ---- killfeed ----
// Deliberately a PURE FUNCTION of the current tick: the feed is "every kill in
// the last N seconds of game time". Nothing is queued, nothing is remembered,
// so scrubbing backwards, jumping rounds and changing speed all stay correct
// with no bookkeeping to get out of sync.
const KILLFEED_SECONDS = 6;   // of game time, so 4x speed doesn't blink entries away
const KILLFEED_MAX     = 5;
const KILLFEED_FADE    = 1;   // seconds of fade-out at the tail

const WEAPON_NAMES = {
  m4a1_silencer:"M4A1-S", usp_silencer:"USP-S", galilar:"GALIL", fiveseven:"FIVE-SEVEN",
  mac10:"MAC-10", tec9:"TEC-9", ak47:"AK-47", m4a1:"M4A1", awp:"AWP", mp7:"MP7",
  mp9:"MP9", famas:"FAMAS", deagle:"DEAGLE", glock:"GLOCK", hegrenade:"HE",
  inferno:"MOLOTOV", world:"WORLD",
};
const weaponLabel = w => WEAPON_NAMES[w] || String(w||"").replace(/_/g,"-").toUpperCase();

// ---- weapon icons ----
// The real CS2 panorama icons, extracted from the local game install
// (pak01_dir.vpk -> panorama/images/icons/equipment/*.vsvg_c) and written to
// viewer/icons/. They are Valve's artwork: fine for local use, but do not
// redistribute this folder. Regenerate with tools/extract_icons.py.
const ICON_FILES = new Set(`ak47 aug awp bizon cz75a deagle elite famas fiveseven g3sg1 galilar
glock hkp2000 p2000 m249 m4a1 m4a1_silencer mac10 mag7 mp5sd mp7 mp9 negev nova p90 p250 revolver
sawedoff scar20 sg556 ssg08 tec9 ump45 usp_silencer xm1014 knife knife_t bayonet taser hegrenade
flashbang smokegrenade decoy molotov incgrenade inferno firebomb c4 planted_c4 world
icon_headshot icon_suicide noscope penetrate blind_kill smoke_kill inairkill`.split(/\s+/));

// CS2 ships an EMPTY world.svg, so world deaths borrow the deathnotice suicide icon.
const ICON_ALIAS = { world: "icon_suicide" };

function iconFile(w){
  w = String(w||"").toLowerCase();
  if (ICON_ALIAS[w]) return ICON_ALIAS[w];
  if (ICON_FILES.has(w)) return w;
  if (w.startsWith("knife") || w === "bayonet") return "knife";   // any skin -> plain knife
  return null;                                                    // unknown -> no icon, never a wrong one
}

function weaponIcon(w){
  const f = iconFile(w);
  return f ? `<img class="wicon" src="icons/${f}.svg" alt="${esc(weaponLabel(w))}">` : "";
}
const sideClass = s => { s=String(s||"").toUpperCase();
  return s.startsWith("CT") ? "side-ct" : s.startsWith("T") ? "side-t" : "side-none"; };
// player names come from the demo file - never inject them as raw HTML
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let kfKey = "";   // rebuild the DOM only when the visible set changes
function drawKillfeed(curTick){
  const el = $("#killfeed"); if(!el) return;
  if(curTick == null || !M){ if(kfKey){el.innerHTML=""; kfKey="";} return; }

  const rate = (M.tickrate)||64;
  const span = KILLFEED_SECONDS*rate;
  const rows = (M.kills||[])
    .filter(k => k.tick!=null && k.tick<=curTick && curTick-k.tick<=span)
    .sort((a,b)=>a.tick-b.tick)
    .slice(-KILLFEED_MAX);

  const key = rows.map(k=>k.tick).join(",");
  if(key !== kfKey){
    kfKey = key;
    el.innerHTML = rows.map(k=>{
      const suicide = k.attacker!=null && k.attacker===k.victim;
      const world   = k.attacker==null;
      const pov     = M.pov && (k.attacker===M.pov || k.victim===M.pov);
      const bits=[];
      if(!world && !suicide){
        bits.push(`<span class="${sideClass(k.attacker_side)}">${esc(k.attacker)}</span>`);
        if(k.assister) bits.push(
          `<span class="as">+ ${esc(k.assister)}${k.flash_assist?" ⚡":""}</span>`);
      }
      bits.push(weaponIcon(k.weapon));
      bits.push(`<span class="w">${esc(weaponLabel(k.weapon))}</span>`);
      if(k.hs) bits.push(`<img class="wicon hs" src="icons/icon_headshot.svg" alt="headshot">`);
      bits.push(`<span class="${sideClass(k.victim_side)}">${esc(k.victim) || "—"}</span>`);
      return `<div class="kf${pov?" pov":""}">${bits.join("")}</div>`;
    }).join("");
  }

  // fade the tail every frame without touching innerHTML
  const kids = el.children;
  for(let i=0;i<kids.length;i++){
    const age = (curTick - rows[i].tick)/rate;
    const left = KILLFEED_SECONDS - age;
    kids[i].style.opacity = left < KILLFEED_FADE ? Math.max(0, left/KILLFEED_FADE) : 1;
  }
}

// ---- playback loop ----
// Advance by real elapsed time, not by one sample per timer tick. This keeps
// playback at true match speed regardless of display refresh rate, and survives
// a dropped frame instead of silently running slow.
let last=0;
function tick(ts){
  requestAnimationFrame(tick);
  if(document.hidden){ last=ts; return; }   // don't fast-forward on tab return
  if(!last) last=ts;
  const dt=Math.min(ts-last, 250);          // clamp a long stall to 0.25s
  last=ts;

  if(playing && frames.length>1){
    pos += (dt/frameMs())*speed;
    if(pos>=frames.length-1){
      pos=frames.length-1; playing=false; $("#play").textContent="▶";
    }
    draw();
  } else if(dirty){
    draw(); dirty=false;
  }
}
requestAnimationFrame(tick);

function seekTo(p){
  pos=Math.max(0,Math.min(frames.length?frames.length-1:0,p));
  resetKillCursor(); dirty=true;
}

// ---- controls ----
$("#play").onclick=()=>{
  if(pos>=frames.length-1) seekTo(0);
  playing=!playing; $("#play").textContent=playing?"❚❚":"▶";
  dirty=true;
};
$("#seek").oninput=e=>seekTo(+e.target.value);
$("#speed").onclick=()=>{speed=speed>=4?0.5:speed*2;$("#speed").textContent=speed+"×";};
function toggleCallouts(){
  showCallouts=!showCallouts;
  const b=$("#toggle-callouts");
  b.textContent = showCallouts?"CALLOUTS ON":"CALLOUTS OFF";
  b.classList.toggle("off",!showCallouts);
  dirty=true; draw();
}
function toggleUtility(){
  showUtility=!showUtility;
  const b=$("#toggle-utility");
  b.textContent = showUtility?"UTILITY ON":"UTILITY OFF";
  b.classList.toggle("off",!showUtility);
  dirty=true; draw();
}
$("#toggle-callouts").onclick=toggleCallouts;
$("#toggle-utility").onclick=toggleUtility;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.code==="Space"){e.preventDefault();$("#play").click();}
  // arrows step one sample (~0.5s) from wherever we are
  if(e.code==="ArrowRight"){e.preventDefault();seekTo(Math.floor(pos)+1);}
  if(e.code==="ArrowLeft"){e.preventDefault();seekTo(Math.ceil(pos)-1);}
  if(e.code==="KeyC"){e.preventDefault();toggleCallouts();}
  if(e.code==="KeyU"){e.preventDefault();toggleUtility();}
});
$("#file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{loadMatch(JSON.parse(rd.result));}catch(err){alert("Bad JSON: "+err.message);}};
  rd.readAsText(f);
};

// ---- boot: load calibration, then a match if one is available ----
// ?match=<name> loads data/<name>.json. Without it we fall back to the tiny
// synthetic sample, which is a 1-round toy - fine as a placeholder, misleading
// as a default when there's a real parsed match sitting in data/.
fetch(CAL_URL).then(r=>r.json()).then(c=>{CAL=c;
  const want = new URLSearchParams(location.search).get("match");
  // _name is how loadMatch knows which sidecars to look for. A match dropped in
  // via the file picker has no name we can derive a URL from, so it just
  // doesn't get one and the coach panel says so.
  const tryLoad = name =>
    fetch(`../data/${name}.json`).then(r=>r.ok?r.json():null)
      .then(d => { if(d) d._name = name; return d; }).catch(()=>null);
  (want ? tryLoad(want) : Promise.resolve(null))
    .then(d => d || tryLoad("_sample_mirage"))
    .then(d => { if(d) loadMatch(d); });
  initAsk();
}).catch(()=>{ $("#empty").innerHTML="<div>map_calibration.json failed to load</div>";});
</script>
